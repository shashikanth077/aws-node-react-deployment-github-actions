# Local stack: MySQL + the API container. Run the React app separately with `npm run dev`.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: localdevpassword
      MYSQL_DATABASE: productsdb
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocaldevpassword"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - dbdata:/var/lib/mysql

  api:
    build: ./backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_NAME: productsdb
      DB_USER: root
      DB_PASSWORD: localdevpassword
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
